[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers -m "not network"
markers =
    network: needs the internet to fetch real structures. Deselected by
        default so the ordinary suite is offline and fast; run with
        `pytest -m network`.
filterwarnings =
    error::DeprecationWarning:prothon.*
    ignore::DeprecationWarning
