[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "prothon-ensembles"
dynamic = ["version"]
description = "Statistically calibrated comparison of protein conformational ensembles using local order parameters"
readme = "README.md"
requires-python = ">=3.9, <3.14"
license = { text = "MIT" }
authors = [
    { name = "Adekunle Aina", email = "kunleaina@gmail.com" },
]
maintainers = [
    { name = "Adekunle Aina", email = "kunleaina@gmail.com" },
]
keywords = [
    "protein-ensembles",
    "conformational-ensembles",
    "molecular-dynamics",
    "intrinsically-disordered-proteins",
    "jensen-shannon",
    "order-parameters",
    "structural-biology",
    "biophysics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "mdtraj>=1.9.7",
    "scipy>=1.9",
    "matplotlib>=3.5",
    # Used by prothon.core.plotting for PCA, MDS and t-SNE. Version 2.0
    # imported it and did not declare it, so a clean install failed on any run
    # that touched dimensionality reduction -- which was the CLI default.
    "scikit-learn>=1.0",
    # Reading a study from a file. Small, pure Python, and already a
    # transitive dependency of most scientific stacks.
    "pyyaml>=5.1",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/aai-research-lab/Prothon"
Repository = "https://github.com/aai-research-lab/Prothon"
Documentation = "https://prothon.readthedocs.io"
Issues = "https://github.com/aai-research-lab/Prothon/issues"
Changelog = "https://github.com/aai-research-lab/Prothon/blob/main/CHANGELOG.md"
Publication = "https://doi.org/10.1021/acs.jcim.3c00145"

[project.scripts]
prothon = "prothon.cli:main"

# The distribution is `prothon-ensembles`; the import name and the command
# are both `prothon`. PyPI's `prothon` was taken in 2020 by an unrelated
# protobuf generator, and a name on PyPI is permanent.
[tool.setuptools]
package-dir = { "" = "src" }
# The 2.0 import name, as a single module. A *package* named Prothon would
# differ from prothon only in case, which is one path on macOS and Windows.
py-modules = ["Prothon"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/prothon/_version.py"
# No fallback_version. A literal here is a version number that goes stale the
# moment the next release is tagged, and would let an sdist built without SCM
# metadata report a version it is not. The sdist ships both PKG-INFO and a
# generated _version.py, so setuptools-scm resolves without a checkout.

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The version lookup must run before the re-exports it does not depend on,
# so the imports below it are deliberately not at the top of the file.
"src/prothon/__init__.py" = ["E402"]
# The shim exists to re-export under the old name.
"src/Prothon.py" = ["F403", "F401", "E402"]
