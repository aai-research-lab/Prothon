# Read the Docs build configuration.
#
# Required at the repository root since 2023. A version tagged before this file
# existed fails with "Config file not found at default path" -- which is what
# v2.1.0 does, and why `stable` must not point at it.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Read the Docs clones with --depth 1 and setuptools-scm derives the
      # version from the nearest tag. Without the tags `prothon.__version__`
      # resolves to a development version and docs/conf.py puts it on every
      # page, so the documentation reports a release that does not exist.
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/conf.py
  # Warnings are errors here for the same reason they are in CI: a page absent
  # from every toctree builds happily and is unreachable, which is a broken
  # build reporting success. Three documents were in exactly that state once.
  fail_on_warning: true

python:
  install:
    # Brings sphinx, sphinx-rtd-theme and myst-parser, and installs the package
    # itself, which autodoc needs to import.
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
