name: tests

on:
  push:
    # Every branch. An allowlist was tried first -- main, v*, fix/*, feat/* --
    # and it failed the moment a branch was called something else: pushing
    # `architecture-2.3` matched nothing and ran no tests at all, silently, so
    # the only way to learn whether a change passed was to merge it to main and
    # watch the jobs run there. That is the wrong end of the operation, and it
    # is the second time this trigger has been the reason.
    #
    # A branch that should not be tested costs a few minutes of runner time. A
    # branch that is not tested costs a broken main.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The tag-triggered publisher calls this exact workflow at the tagged
  # commit. Publication therefore depends on the same matrix, real-data and
  # documentation jobs as an ordinary change.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Test both supported boundaries and one representative middle
        # version. Python 3.10 and 3.12 remain supported, but repeating every
        # minor on every OS added six jobs without exercising another boundary.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0          # setuptools-scm needs the tags
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: ruff check src tests

      - name: Test
        run: pytest --cov=prothon --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Smoke-test the CLI
        run: |
          prothon --version
          prothon --info

  real-data:
    name: Real proteins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Deselected from the ordinary suite so that it stays offline and fast.
      # Run here, where fetching a handful of small public structures is fine.
      - name: Test against real structures
        run: pytest -m network -v

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # A docs build that only runs on Read the Docs breaks in a pull request
      # and is discovered after merging. -W turns warnings into errors, so a
      # dead cross-reference or a page missing from the toctree fails here.
      - name: Install
        run: python -m pip install -e ".[docs]"

      - name: Build
        run: |
          sphinx-build --keep-going -b html docs docs/_build/html 2>&1 | tee sphinx.log
          # Fail on any warning except an unreachable intersphinx inventory,
          # which is a transient network problem at python.org or numpy.org and
          # not something a pull request can fix.
          if grep -E "WARNING|ERROR" sphinx.log \
               | grep -v "failed to reach any of the inventories" \
               | grep -q .; then
            echo "::error::the documentation build produced warnings"
            grep -E "WARNING|ERROR" sphinx.log | grep -v "failed to reach any of the inventories"
            exit 1
          fi

  security:
    name: Dependency and secret evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Prepare evidence directory
        run: |
          mkdir security-evidence
          echo '{"status":"not run"}' > security-evidence/detect-secrets.json
          echo '{"status":"not run"}' > security-evidence/prothon.cdx.json

      - name: Install the runtime and security tools separately
        run: |
          python -m venv "$RUNNER_TEMP/prothon-runtime"
          "$RUNNER_TEMP/prothon-runtime/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/prothon-runtime/bin/python" -m pip install .
          "$RUNNER_TEMP/prothon-runtime/bin/python" -m pip freeze \
            > security-evidence/runtime-requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements/security.txt
          python -m pip freeze > security-evidence/security-tools.txt

      - name: Refuse secrets in tracked source
        run: |
          # This one shape is public package metadata, not a credential.  It
          # cannot carry an inline pragma because the reference recipe must
          # remain byte-for-byte identical to the conda-forge recipe.  The
          # separate sync gate verifies the digest against PyPI.
          detect-secrets scan --no-verify \
            --exclude-lines '^\s*sha256:\s*[0-9a-f]{64}\s*$' \
            > security-evidence/detect-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("security-evidence/detect-secrets.json").read_text())
          findings = report.get("results", {})
          if findings:
              for filename, matches in sorted(findings.items()):
                  lines = ", ".join(str(match["line_number"]) for match in matches)
                  print(f"::error file={filename},line={matches[0]['line_number']}::"
                        f"possible secret(s) on line(s) {lines}")
              raise SystemExit("secret scan found material that must be removed or reviewed")
          print("No possible secrets found in tracked source")
          PY

      - name: Audit runtime dependencies and write the SBOM
        run: |
          RUNTIME_SITE=$("$RUNNER_TEMP/prothon-runtime/bin/python" - <<'PY'
          import site
          print(site.getsitepackages()[0])
          PY
          )
          pip-audit \
            --strict \
            --progress-spinner off \
            --path "$RUNTIME_SITE" \
            --format cyclonedx-json \
            --output security-evidence/prothon.cdx.json

      - name: Retain security evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-evidence
          path: security-evidence/
          if-no-files-found: error
