name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # setuptools-scm needs the tags

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: ruff check src tests

      - name: Test
        run: pytest --cov=prothon --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Smoke-test the CLI
        run: |
          prothon --version
          prothon --info

  real-data:
    name: Real proteins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Deselected from the ordinary suite so that it stays offline and fast.
      # Run here, where fetching a handful of small public structures is fine.
      - name: Test against real structures
        run: pytest -m network -v

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A docs build that only runs on Read the Docs breaks in a pull request
      # and is discovered after merging. -W turns warnings into errors, so a
      # dead cross-reference or a page missing from the toctree fails here.
      - name: Install
        run: python -m pip install -e ".[docs]"

      - name: Build
        run: |
          sphinx-build --keep-going -b html docs docs/_build/html 2>&1 | tee sphinx.log
          # Fail on any warning except an unreachable intersphinx inventory,
          # which is a transient network problem at python.org or numpy.org and
          # not something a pull request can fix.
          if grep -E "WARNING|ERROR" sphinx.log \
               | grep -v "failed to reach any of the inventories" \
               | grep -q .; then
            echo "::error::the documentation build produced warnings"
            grep -E "WARNING|ERROR" sphinx.log | grep -v "failed to reach any of the inventories"
            exit 1
          fi
