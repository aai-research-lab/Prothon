name: Scientific calibration evidence

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "43 7 1 * *"

permissions:
  contents: read

jobs:
  calibrate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: local-null
            name: Calibrate the correlated local null
            command: >-
              python scripts/calibration.py
              --quick
              --study correlation
              --replicates 150
              --workers 3
              --out calibration-evidence/local-calibration.md
              --json calibration-evidence/local-calibration.json
          - gate: default-path
            name: Calibrate default subsampling
            command: >-
              python scripts/calibration.py
              --quick
              --study default_path
              --replicates 250
              --workers 3
              --out calibration-evidence/default-path-calibration.md
              --json calibration-evidence/default-path-calibration.json
          - gate: floors
            name: Calibrate floor verdicts
            command: >-
              python scripts/floor_calibration.py
              --replicates 60
              --out calibration-evidence/floor-calibration.md
              --json calibration-evidence/floor-calibration.json
          - gate: joint
            name: Calibrate MMD and C2ST
            command: >-
              python scripts/joint_calibration.py
              --out calibration-evidence/joint-calibration.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Prepare evidence directory
        run: mkdir calibration-evidence
      - name: Run the ${{ matrix.gate }} gate
        id: gate
        continue-on-error: true
        run: ${{ matrix.command }}
      - name: Retain calibration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-calibration-evidence-${{ matrix.gate }}
          path: calibration-evidence/
          if-no-files-found: error
      - name: Enforce the calibration gate
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: test "$GATE_OUTCOME" = success
