name: Performance regression evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 8 * *"

permissions:
  contents: read

jobs:
  envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Prepare evidence directory
        run: mkdir performance-evidence
      - name: Measure the quick performance envelope
        id: envelope
        continue-on-error: true
        run: |
          python scripts/scale_envelope.py \
            --timeout 600 \
            --out performance-evidence/performance.md \
            --json performance-evidence/performance.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-regression-evidence
          path: performance-evidence/
          if-no-files-found: error
      - name: Enforce every performance gate
        if: always()
        env:
          ENVELOPE_OUTCOME: ${{ steps.envelope.outcome }}
        run: test "$ENVELOPE_OUTCOME" = success
