name: Performance regression evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 8 * *"

permissions:
  contents: read

jobs:
  envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Prepare evidence directory
        run: mkdir performance-evidence
      - name: Measure the quick performance envelope
        id: envelope
        continue-on-error: true
        run: |
          python scripts/scale_envelope.py \
            --timeout 600 \
            --out performance-evidence/performance.md \
            --json performance-evidence/performance.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-regression-evidence
          path: performance-evidence/
          if-no-files-found: error
      - name: Enforce every performance gate
        if: always()
        env:
          ENVELOPE_OUTCOME: ${{ steps.envelope.outcome }}
        run: test "$ENVELOPE_OUTCOME" = success
