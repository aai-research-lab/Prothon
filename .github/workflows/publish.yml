name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Test the tagged commit
    uses: ./.github/workflows/tests.yml
    secrets: inherit  # pragma: allowlist secret

  build:
    name: Build distributions
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0          # setuptools-scm reads the tag
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: Verify the built version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(ls dist/*.tar.gz | sed -E 's/.*prothon_ensembles-(.*)\.tar\.gz/\1/')
          echo "built: $VER   tag: $TAG"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::built version ($VER) does not match the tag ($TAG). A dirty tree or a missing tag will do this."
            exit 1
          fi

      - name: Check the metadata PyPI will render
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-distributions:
    name: Smoke-test ${{ matrix.distribution }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
    steps:
      # Deliberately do not check out the repository. Imports can only come
      # from the downloaded release artifact, never from an editable tree.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install the exact ${{ matrix.distribution }} in a clean environment
        shell: bash
        run: |
          if [ "${{ matrix.distribution }}" = wheel ]; then
            PACKAGE=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          else
            PACKAGE=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          fi
          if [ -z "$PACKAGE" ]; then
            echo "::error::the requested ${{ matrix.distribution }} is absent"
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/prothon-smoke"
          "$RUNNER_TEMP/prothon-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/prothon-smoke/bin/python" -m pip install "$PACKAGE"
          "$RUNNER_TEMP/prothon-smoke/bin/python" -m pip check

      - name: Smoke-test the installed import and CLI
        shell: bash
        run: |
          "$RUNNER_TEMP/prothon-smoke/bin/python" -I - <<'PY'
          from importlib.metadata import version
          import prothon
          from prothon import Prothon

          assert prothon.__version__ == version("prothon-ensembles")
          assert "cbcn" in Prothon.order_parameters()
          print(f"installed prothon {prothon.__version__}")
          PY
          "$RUNNER_TEMP/prothon-smoke/bin/prothon" --version
          "$RUNNER_TEMP/prothon-smoke/bin/prothon" info > /dev/null

  publish:
    name: Publish to PyPI
    needs: [build, test-distributions]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write           # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
