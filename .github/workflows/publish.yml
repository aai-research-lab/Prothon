name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # A branch dry-run builds and tests both artifacts without entering the
  # protected PyPI environment. This is how release plumbing is proved before
  # a tag makes it consequential.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test the tagged commit
    uses: ./.github/workflows/tests.yml
    secrets: inherit  # pragma: allowlist secret

  build:
    name: Build distributions
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0          # setuptools-scm reads the tag
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: Verify the built version matches the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(ls dist/*.tar.gz | sed -E 's/.*prothon_ensembles-(.*)\.tar\.gz/\1/')
          echo "built: $VER   tag: $TAG"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::built version ($VER) does not match the tag ($TAG). A dirty tree or a missing tag will do this."
            exit 1
          fi

      - name: Check the metadata PyPI will render
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-distributions:
    name: Test the exact ${{ matrix.distribution }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
    steps:
      # The checkout supplies tests and documentation, but is never installed.
      # Every Python invocation below uses isolated mode and first proves that
      # Prothon resolves outside GITHUB_WORKSPACE.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install the exact ${{ matrix.distribution }} in a clean environment
        shell: bash
        run: |
          mkdir release-evidence
          if [ "${{ matrix.distribution }}" = wheel ]; then
            PACKAGE=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          else
            PACKAGE=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          fi
          if [ -z "$PACKAGE" ]; then
            echo "::error::the requested ${{ matrix.distribution }} is absent"
            exit 1
          fi
          PACKAGE=$(realpath "$PACKAGE")
          sha256sum "$PACKAGE" \
            > release-evidence/prothon-${{ matrix.distribution }}.sha256
          python -m venv "$RUNNER_TEMP/prothon-artifact"
          PYTHON="$RUNNER_TEMP/prothon-artifact/bin/python"
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install "$PACKAGE"
          "$PYTHON" -m pip check
          "$PYTHON" -m pip freeze --exclude prothon-ensembles \
            > release-evidence/runtime-requirements.txt

          "$PYTHON" -I - <<'PY' > release-evidence/installed-package.json
          import json
          import os
          from importlib.metadata import version
          from pathlib import Path

          import prothon

          location = Path(prothon.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if location == workspace or workspace in location.parents:
              raise SystemExit(f"import resolved to checkout instead of artifact: {location}")
          print(json.dumps({
              "distribution": os.environ["MATRIX_DISTRIBUTION"],
              "installed_version": version("prothon-ensembles"),
              "import_path": str(location),
          }, indent=2))
          PY
          echo "$RUNNER_TEMP/prothon-artifact/bin" >> "$GITHUB_PATH"
          echo "PROTHON_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
        env:
          MATRIX_DISTRIBUTION: ${{ matrix.distribution }}

      - name: Install the artifact's test extras and security tools
        run: |
          "$RUNNER_TEMP/prothon-artifact/bin/python" -m pip install \
            "${PROTHON_PACKAGE}[dev,docs]" -r requirements/security.txt
          "$RUNNER_TEMP/prothon-artifact/bin/python" -m pip check
          "$RUNNER_TEMP/prothon-artifact/bin/python" -m pip freeze \
            > release-evidence/test-environment.txt

      - name: Audit the artifact's resolved runtime dependencies
        id: audit
        continue-on-error: true
        run: |
          pip-audit \
            --strict \
            --progress-spinner off \
            --requirement release-evidence/runtime-requirements.txt \
            --no-deps \
            --disable-pip \
            --format cyclonedx-json \
            --output release-evidence/prothon-${{ matrix.distribution }}.cdx.json

      - name: Run the offline suite against the installed artifact
        id: tests
        continue-on-error: true
        run: |
          python -I -m pytest 2>&1 | tee release-evidence/offline-tests.log

      - name: Lint the installed artifact
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          PACKAGE_DIR=$(python -I - <<'PY'
          from pathlib import Path
          import prothon
          print(Path(prothon.__file__).resolve().parent)
          PY
          )
          SHIM=$(python -I - <<'PY'
          from importlib.util import find_spec
          print(find_spec("Prothon").origin)
          PY
          )
          mkdir -p "$RUNNER_TEMP/artifact-lint/src"
          cp -R "$PACKAGE_DIR" "$RUNNER_TEMP/artifact-lint/src/prothon"
          cp "$SHIM" "$RUNNER_TEMP/artifact-lint/src/Prothon.py"
          (
            cd "$RUNNER_TEMP/artifact-lint"
            ruff check --config "$GITHUB_WORKSPACE/pyproject.toml" \
              --exclude _version.py src
          ) 2>&1 | tee release-evidence/lint.log

      - name: Build documentation against the installed artifact
        id: docs
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-docs"
          cp -R docs "$RUNNER_TEMP/artifact-docs/docs"
          (
            cd "$RUNNER_TEMP/artifact-docs/docs"
            sphinx-build --keep-going -b html . _build/html 2>&1 \
              | tee "$GITHUB_WORKSPACE/release-evidence/sphinx.log"
          )
          if grep -E "WARNING|ERROR" release-evidence/sphinx.log \
               | grep -v "failed to reach any of the inventories" \
               | grep -q .; then
            echo "::error::the artifact documentation build produced warnings"
            grep -E "WARNING|ERROR" release-evidence/sphinx.log \
              | grep -v "failed to reach any of the inventories"
            exit 1
          fi

      - name: Test the artifact against real protein structures
        id: real
        continue-on-error: true
        run: |
          python -I -m pytest -m network -v tests/test_real_data.py 2>&1 \
            | tee release-evidence/real-proteins.log

      - name: Smoke-test the installed import and CLI
        id: cli
        continue-on-error: true
        shell: bash
        run: |
          python -I - <<'PY'
          from importlib.metadata import version
          import prothon
          from prothon import Prothon

          assert prothon.__version__ == version("prothon-ensembles")
          assert "cbcn" in Prothon.order_parameters()
          print(f"installed prothon {prothon.__version__}")
          PY
          prothon --version
          prothon info > /dev/null

      - name: Retain installed-artifact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.distribution }}
          path: release-evidence/
          if-no-files-found: error

      - name: Enforce every installed-artifact gate
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
          REAL_OUTCOME: ${{ steps.real.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
        run: |
          test "$AUDIT_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$LINT_OUTCOME" = success
          test "$DOCS_OUTCOME" = success
          test "$REAL_OUTCOME" = success
          test "$CLI_OUTCOME" = success

  publish:
    name: Publish to PyPI
    needs: [build, test-distributions]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write           # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
